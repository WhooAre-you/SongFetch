<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#07080d;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" fill="#07080d"/>

  <!-- Glow bloom centered -->
  <ellipse cx="50" cy="50" rx="40" ry="40" fill="url(#glow)"/>

  <!-- Note group centered: note spans roughly x=33..67, y=18..78 -->
  <g transform="translate(50,50)">
    <!-- Stem: right side, from top (-28) to bottom of head area (+18) -->
    <rect x="10" y="-28" width="6" height="44" rx="3" fill="url(#noteGrad)"/>

    <!-- Flag: curves from top of stem -->
    <path d="M16 -28 Q34 -18 30 2 Q22 -8 16 -6 Z" fill="url(#noteGrad)"/>

    <!-- Note head: centered on stem base, slightly left -->
    <ellipse cx="-1" cy="18" rx="12" ry="8" transform="rotate(-18 -1 18)" fill="url(#noteGrad)"/>
  </g>
</svg>
